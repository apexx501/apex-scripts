<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX STORE - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFD000;
            --bg: #070F1E;
            --card-bg: #0F172A;
            --danger: #FF4D4D;
            --success: #00FF88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: #fff; padding: 20px; }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--yellow);
            margin-bottom: 30px;
        }

        h1 { color: var(--yellow); font-size: 24px; }

        .login-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--yellow);
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1E293B;
            border: 1px solid rgba(255, 208, 0, 0.3);
            border-radius: 6px;
            color: #fff;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: var(--yellow);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #1E293B; }
        .card h3 { color: var(--yellow); margin-bottom: 15px; }

        .status-btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 10px; }
        .status-on { background: rgba(0, 255, 136, 0.2); color: var(--success); border: 1px solid var(--success); }
        .status-off { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #1E293B; font-size: 13px; }
        th { background: #1E293B; color: var(--yellow); }

        .hidden { display: none; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; }
        .badge-active { background: var(--success); color: #000; }
        .badge-unused { background: #334155; color: #fff; }
        .badge-disabled { background: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-box">
        <h2>APEX STORE Admin</h2>
        <p style="font-size: 12px; color: #8892B0; margin-bottom: 15px;">تسجيل الدخول للوحة التحكم</p>
        <input type="text" id="hostUrl" value="http://65.21.143.240:27595" placeholder="رابط السيرفر">
        <input type="password" id="adminPass" placeholder="كلمة السر الأدمن">
        <button onclick="login()">دخول اللوحة 🔑</button>
    </div>

    <div id="dashboardSection" class="container hidden">
        <header>
            <h1>APEX STORE • DASHBOARD CONTROL</h1>
            <button onclick="regenerateKeys()" style="background: var(--danger); color: #fff;">⚠️ إعادة توليد كافة المفاتيح</button>
        </header>

        <!-- حالة السكربتات -->
        <h2 style="margin-bottom: 15px; color: var(--yellow);">حالة السكربتات العامة</h2>
        <div class="grid">
            <div class="card">
                <h3>🎣 سكربت الصيد</h3>
                <button id="btn-fishing" class="status-btn status-on" onclick="toggleScript('fishing')">شغال ⚡</button>
            </div>
            <div class="card">
                <h3>🎯 إيم بوت Aimbot</h3>
                <button id="btn-aim" class="status-btn status-on" onclick="toggleScript('aim')">شغال ⚡</button>
            </div>
        </div>

        <!-- إدارة المفاتيح والمستخدمين -->
        <h2 style="margin-bottom: 15px; color: var(--yellow);">إدارة المفاتيح والمستخدمين</h2>
        <table>
            <thead>
                <tr>
                    <th>المفتاح</th>
                    <th>المنتج</th>
                    <th>الحالة / المستخدم</th>
                    <th>المدة</th>
                    <th>التحكم</th>
                </tr>
            </thead>
            <tbody id="keysTable">
                <!-- يتم التعبئة تلقائياً -->
            </tbody>
        </table>
    </div>

    <script>
        let HOST_URL = "";
        let ADMIN_PASS = "";

        async function login() {
            HOST_URL = document.getElementById('hostUrl').value.replace(/\/$/, "");
            ADMIN_PASS = document.getElementById('adminPass').value;

            try {
                const res = await fetch(`${HOST_URL}/api/admin/data`, {
                    headers: { 'x-admin-password': ADMIN_PASS }
                });

                if (res.ok) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadData();
                    setInterval(loadData, 5000); // تحديث بيانات تلقائي كل 5 ثواني
                } else {
                    alert("كلمة المرور خاطئة أو تعذر الاتصال بالسيرفر!");
                }
            } catch (e) {
                alert("خطأ في الاتصال بالسيرفر!");
            }
        }

        async function loadData() {
            const res = await fetch(`${HOST_URL}/api/admin/data`, {
                headers: { 'x-admin-password': ADMIN_PASS }
            });
            const data = await res.json();

            // تحديث أزرار التشغيل/الإيقاف
            updateScriptBtn('fishing', data.scriptStatus.fishing);
            updateScriptBtn('aim', data.scriptStatus.aim);

            // تحديث جدول المفاتيح
            const tbody = document.getElementById('keysTable');
            tbody.innerHTML = '';

            for (const [key, info] of Object.entries(data.keys)) {
                let statusBadge = `<span class="badge badge-unused">غير مستخدم</span>`;
                if (info.disabled) {
                    statusBadge = `<span class="badge badge-disabled">معطل</span>`;
                } else if (info.status === 'active') {
                    statusBadge = `<span class="badge badge-active">@${info.assignedUser}</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td style="font-family: monospace;">${key}</td>
                        <td>${info.product === 'fishing' ? '🎣 الصيد' : '🎯 Aimbot'}</td>
                        <td>${statusBadge}</td>
                        <td>${info.durationHours === -1 ? 'مدى الحياة' : info.durationHours + ' ساعة'}</td>
                        <td>
                            <button onclick="toggleKey('${key}')" style="background:#334155; color:#fff; padding:4px 8px; font-size:11px;">${info.disabled ? 'تفعيل' : 'تعطيل'}</button>
                            ${info.durationHours !== -1 ? `<button onclick="addHours('${key}', 24)" style="background:var(--yellow); color:#000; padding:4px 8px; font-size:11px;">+24س</button>` : ''}
                        </td>
                    </tr>
                `;
            }
        }

        function updateScriptBtn(prod, status) {
            const btn = document.getElementById(`btn-${prod}`);
            if (status) {
                btn.className = "status-btn status-on";
                btn.innerText = "شغال ⚡";
            } else {
                btn.className = "status-btn status-off";
                btn.innerText = "متوقف / صيانة ❌";
            }
        }

        async function toggleScript(prod) {
            const currentStatus = document.getElementById(`btn-${prod}`).classList.contains('status-on');
            await fetch(`${HOST_URL}/api/admin/toggle-script`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': ADMIN_PASS },
                body: JSON.stringify({ product: prod, status: !currentStatus })
            });
            loadData();
        }

        async function toggleKey(key) {
            await fetch(`${HOST_URL}/api/admin/toggle-key`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': ADMIN_PASS },
                body: JSON.stringify({ key: key })
            });
            loadData();
        }

        async function addHours(key, hours) {
            await fetch(`${HOST_URL}/api/admin/add-hours`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': ADMIN_PASS },
                body: JSON.stringify({ key: key, hours: hours })
            });
            loadData();
        }

        async function regenerateKeys() {
            if (confirm("هل أنت تأكد من إعادة توليد وحذف كل المفاتيح الحالية؟")) {
                await fetch(`${HOST_URL}/api/admin/regenerate`, {
                    method: 'POST',
                    headers: { 'x-admin-password': ADMIN_PASS }
                });
                loadData();
            }
        }
    </script>

</body>
</html>
